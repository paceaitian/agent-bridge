name: ci

on:
  push:
    # ci/** 是上游合入前的验证分支：从上游候选导出、只为在真实 Windows 上先跑一遍，不合进 main
    branches: [main, 'ci/**']
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 只用标准库：不装任何依赖，这本身就是「独立可跑」的门禁
      - name: unittest
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python3 -m unittest discover -s tests -t tests -v
      - name: import manifest matches the imported files
        run: python3 scripts/check-import-manifest.py

  windows:
    # Windows 选择集：假内核与可移植用例在真实 Windows 上跑，另含只读的本对象原生冒烟（不执行 provider 门）
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Windows selection
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B scripts/verify-bridge-windows.py
